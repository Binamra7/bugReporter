name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # The repository tests start a real mongod via mongodb-memory-server; cache its binary between runs.
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            # Builds without runtime secrets: configuration is read per request, not at build time.
            - run: npm run build
