name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # The repository tests start a real mongod via mongodb-memory-server; cache its binary between runs.
            - uses: actions/cache@v6
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            # Builds without runtime secrets: configuration is read per request, not at build time.
            - run: npm run build

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            mongo:
                image: mongo:8
                ports: ['27017:27017']
                # Steps start only once mongod answers, not merely when the container is up.
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # Builds and serves the production app, seeds bug-reporter-e2e, then runs every scenario.
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
